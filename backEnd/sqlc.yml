version: "2"
sql:
  - engine: "postgresql"
    queries: "./sql/user_management/queries.sql" 
    schema: "./sql/user_management/schema.sql"
    gen:
      go:
        package: "db"
        out: "./user_menagement/infrastructure/persistence/database"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
        - db_type: "date"
          go_type: "time.Time"
        - db_type: "uuid"
          go_type: "github.com/google/uuid.UUID"